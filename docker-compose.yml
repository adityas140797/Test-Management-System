services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: test_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_management"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports: ["5000:5000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
